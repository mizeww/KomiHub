{% extends "base.html" %}

{% block content1 %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/quiz_style.css') }}">
<div class="quiz-card">
    <!-- Прогресс-бар (расчет на 20 вопросов) -->
    <div class="progress-info">
        <span>Вопрос {{ step + 1 if stats else 1 }} из 20</span>
    </div>
    <div class="progress">
        <div class="progress-bar" style="width: {{ (step / 20) * 100 if stats else 0 }}%"></div>
    </div>

    <div class="quiz-content">
        <!-- Берем данные из session['current_card'] -->
        <div class="word-kom">{{ card.word_kom }}</div>
        <div class="word-rus-label">переводится как</div>
        <div class="word-rus-value">«{{ card.display_rus }}»?</div>
    </div>

    <form method="POST">
        {{ form.hidden_tag() }}

        <div class="options-group">
            {% for subfield in form.answer %}
                <input type="radio" class="btn-check" name="{{ form.answer.name }}"
                       id="{{ subfield.id }}" value="{{ subfield.data }}" required>
                <label class="btn btn-outline-custom" for="{{ subfield.id }}">
                    <!-- subfield.label.text обычно содержит "Верно" или "Неверно" из определения формы -->
                    {{ subfield.label.text }}
                </label>
            {% endfor %}
        </div>

        <button type="submit" class="btn-next">Ответить</button>
        </form>

    </div>
{% endblock %}
