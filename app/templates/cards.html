{% extends "base.html" %}


{% block content %}
<!-- Контейнер для сетки -->
<div class="card-grid">
    {% for card in word_cards %}
    <div class="card">
        <img src="{{ url_for('static', filename='img/cards/' ~ folder ~ '/' ~ card.id ~ '.jpg') }}" alt="{{ card.id }}" loading="lazy">
        <div class="card-content">
            <h3>{{ card.word_kom }}</h3>
            <p>{{ card.word_rus }}</p>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
