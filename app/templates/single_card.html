{% extends "base.html" %}
{% block content %}
<div class="container mt-5 d-flex justify-content-center">
    <div class="card text-center p-4" style="max-width: 500px; width: 100%;">
        <img src="{{ url_for('static', filename='img/cards/' ~ folder ~ '/' ~ card.id ~ '.jpg') }}" class="img-fluid rounded mb-3" alt="{{ card.id }}">
        <div class="card-body">
            <h1 class="text-primary mb-2">{{ card.value }}</h1>
            <h3 class="text-muted">{{ card.translate }}</h3>
            <div class="mt-4">
                <a href="javascript:history.back()" class="btn btn-secondary">Назад к списку</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
