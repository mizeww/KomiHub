{% extends "base.html" %}

{% block content1 %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/quiz_style.css') }}">
<div class="quiz-card">
    <!-- Прогресс-бар (расчет на 20 вопросов) -->
    <div class="progress-info">
        <span>Вопрос {{ step + 1 if stats else 1 }} из 20</span>
    </div>
    <div class="progress">
        <div class="progress-bar" style="width: {{ (step / 20) * 100 if stats else 0 }}%"></div>
    </div>

    <div class="quiz-content">
        <div class="word-kom">{{ card.word_kom }}</div>
        <div class="word-rus-label">Выберите правильный перевод:</div>
    </div>

    <form method="POST">
        {{ form.hidden_tag() }}

        <div class="options-group">
            {% for subfield in form.answer %}
                <!-- Для красивой сетки на 4 варианта input и label обернуты в отдельные блоки -->
                <div>
                    <input type="radio" class="btn-check" name="{{ form.answer.name }}"
                           id="{{ subfield.id }}" value="{{ subfield.data }}" required>
                    <label class="btn btn-outline-custom w-100 h-100" for="{{ subfield.id }}">
                        {{ subfield.label.text }}
                    </label>
                </div>
            {% endfor %}
        </div>

        <button type="submit" class="btn-next">Ответить</button>
    </form>
</div>
{% endblock %}
