<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/index_style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <script src="/static/javascript/script.js" defer></script>
    <title>{{ title }}</title>
</head>
<body class="bg-light text-dark">
<header class="main-header">
    <div class="header-container"> <!-- Добавили обертку -->
        <nav class="nav-links">
            <a href="/" class="logo-small">KömiHub</a>
            <a href="/trainers">Тренажеры</a>
            <a href="/cards">Карточки</a>
        </nav>

        <form id="translateForm" class="search-container">
        {{ TranslateForm.hidden_tag() }}
        {{ TranslateForm.word(id="wordInput", class="search-input") }}
        {{ TranslateForm.submit(class="search-button") }}
        </form>

        <div class="auth-block">
            {% if current_user.is_authenticated %}
                <a href="/user">{{ current_user.name }}</a>
            {% else %}
                <a href="/login">Войти / Регистрация</a>
            {% endif %}
        </div>
    </div>
</header>

<!-- 2. Большой экран (Hero) -->
<section class="hero-screen">
    <div class="hero-content">
        <h1 class="hero-title">KömiHub</h1>
    </div>
</section>

<!-- 3. Основной контент -->
<main class="content">
    <div class="container">
        <!-- Ваш контент здесь -->
    </div>
</main>

<script>
    document.getElementById('translateForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const word = document.getElementById('wordInput').value.trim();
        if (word) {
            // Формируем чистый URL: /translate/apple
            window.location.href = '/translate/' + encodeURIComponent(word);
        }
    });
</script>

</body>
</html>
